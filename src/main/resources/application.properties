# Configuracao da Porta do Servidor para Nuvem (Render / Railway / Docker)
server.port=${PORT:8080}

# Configuracao de Banco de Dados MySQL (Nuvem via Variaveis de Ambiente ou Local por padrao)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost/eventcalend_api}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}

# Configuracao de E-mail (SMTP)
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:suporte@eventcalend.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}

# Configuracoes JPA / Hibernate em Producao
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
